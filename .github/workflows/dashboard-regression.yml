name: Dashboard regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dashboard-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install Python test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Python regression suite
        run: python -m pytest tests -q
      - name: Browser logic regression suites
        run: node --test tests/*.test.cjs
      - name: Release preflight
        run: python scripts/release_preflight.py
      - name: Isolated runtime and authentication boundary
        run: python -O scripts/verify-release.py
