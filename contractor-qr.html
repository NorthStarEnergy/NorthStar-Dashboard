<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Northstar Site QR Links</title>
<style>
body{margin:0;background:#0b1117;color:#edf3f5;font-family:Arial,sans-serif;padding:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{background:#121d25;border:1px solid #293943;border-radius:8px;padding:14px;text-align:center}
.card h2{font:700 14px monospace}.card img{width:150px;height:150px;background:white;padding:8px}
.card a{display:block;color:#69b7e8;font:9px monospace;word-break:break-all;margin-top:8px}
.muted{color:#82929d;font:11px monospace;line-height:1.6}
</style>
</head>
<body>
<h1>Northstar Contractor QR Links</h1>
<p class="muted">These QR codes use signed, site-scoped tokens. Print each code at its matching site entrance.</p>
<p class="muted" id="status">Loading active site tokens…</p>
<div class="grid" id="grid"></div>
<script>
const grid=document.querySelector('#grid'),statusNode=document.querySelector('#status');
const escapeHtml=value=>String(value??'').replace(/[<>&"]/g,char=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[char]));
let checkinOrigin=location.origin;
function render(records){
  const base=checkinOrigin+'/contractor-checkin.html?token=';
  grid.innerHTML=records.map(record=>{const link=base+encodeURIComponent(record.token);return `<article class="card"><h2>${escapeHtml(record.site)}</h2><img alt="${escapeHtml(record.site)} check-in QR code" src="https://quickchart.io/qr?size=220&text=${encodeURIComponent(link)}"><a href="${link}">${escapeHtml(link)}</a><p class="muted">Expires ${escapeHtml(new Date(record.expiresAt).toLocaleDateString())}</p></article>`}).join('');
  statusNode.textContent=records.length+' active site tokens loaded.';
}
fetch('/api/health').then(response=>response.ok?response.json():null).then(health=>{if(health&&health.checkinOrigin)checkinOrigin=health.checkinOrigin})
  .catch(()=>{})
  .then(()=>fetch('/api/checkin-tokens?ts='+Date.now())).then(response=>{if(!response.ok)throw new Error('HTTP '+response.status);return response.json()}).then(render).catch(error=>{statusNode.textContent='Token service unavailable — open this page through the Northstar server. '+error.message});
</script>
</body>
</html>
