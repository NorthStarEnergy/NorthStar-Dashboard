<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NorthStar Operator Sign In</title>
<!-- Packet 19. There is no credential in this page: the form posts to
     /api/auth/login and the server decides. Nothing here grants access, and
     nothing here may ever be allowed to (see the retired auth.js). -->
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#071015;color:#e7edf2;font:16px Arial,sans-serif}.login-shell{width:min(430px,calc(100vw - 40px))}.disclaimer{margin:0 0 12px;padding:10px 14px;border:1px solid #5c4724;border-radius:6px;background:#211b10;color:#e6c57e;font:11px/1.45 monospace}.card{width:100%;padding:32px 34px;border:1px solid #2c4254;border-radius:10px;background:#111a24;box-shadow:0 24px 70px #0008}.brand-row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 30px}.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand img{width:48px;height:48px;object-fit:contain}.brand span{color:#f1f6fb;font-size:25px;font-weight:700;letter-spacing:-.04em}.brand small{display:block;margin-top:3px;color:#1598e5;font:700 10px monospace;letter-spacing:.18em;text-transform:uppercase}.service-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px}.service-status{display:flex;align-items:center;gap:6px;color:#77d69a;font-size:10px;font-weight:700;white-space:nowrap}.service-status i{width:7px;height:7px;background:#43d17a;border-radius:50%;box-shadow:0 0 9px #43d17a;display:block}.system-time{color:#5ec8f3;font:10px monospace;white-space:nowrap}.login-version{position:relative;display:inline-block;margin-top:5px;color:#8aa7bb;font:10px monospace;cursor:help}.login-version:focus-visible{outline:1px solid #5ec8f3;outline-offset:3px}.login-version::after{content:attr(data-release-info);position:absolute;z-index:10;right:0;top:calc(100% + 7px);width:max-content;max-width:min(300px,calc(100vw - 50px));padding:9px 11px;border:1px solid #2c4254;border-radius:5px;background:#14232c;color:#e7edf2;font:11px/1.45 Arial,sans-serif;box-shadow:0 8px 22px #0009;white-space:normal;opacity:0;visibility:hidden;transform:translateY(4px);transition:opacity .15s ease,transform .15s ease,visibility .15s ease;pointer-events:none}.login-version:hover::after,.login-version:focus::after,.login-version:focus-visible::after{opacity:1;visibility:visible;transform:translateY(0)}label{display:block;margin:16px 0 0;color:#9db0bd;font:11px monospace}input{display:block;box-sizing:border-box;width:100%;margin-top:7px;padding:12px;background:#0a0f15;color:#fff;border:1px solid #2c4254;border-radius:5px;font:inherit}button{width:100%;margin-top:20px;padding:12px;background:#1598e5;color:#fff;border:0;border-radius:5px;font-weight:700;cursor:pointer}button[disabled]{opacity:.6;cursor:progress}.error{min-height:18px;margin-top:12px;color:#ff8d78;font-size:12px}.notice{min-height:0;margin-top:12px;color:#9db0bd;font-size:12px}.foot{margin-top:22px;color:#9db0bd;font-size:15px;line-height:1.5}.field-staff-link{display:block;margin-top:12px;padding:12px;background:transparent;color:#8ed7ff;border:1px solid #2c78a2;border-radius:5px;font-size:14px;font-weight:700;text-align:center;text-decoration:none}.field-staff-link:hover{background:#123247}</style></head>
<body><div class="login-shell"><main class="card">
<div class="brand-row"><div class="brand"><img src="/northstar-symbol.png" alt=""><span>NorthStar<small>Operations Dashboard</small></span></div><div class="service-meta"><div class="service-status"><i></i>SERVICE RUNNING</div><div class="system-time" id="systemTime">00:00:00</div><span class="login-version" id="loginVersion" tabindex="0" aria-label="Application version and release details">VERSION</span></div></div>
<form id="operatorSignIn">
  <label for="username">USERNAME</label>
  <input id="username" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
  <label for="password">PASSWORD</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">OPEN DASHBOARD</button>
  <div class="notice" id="notice"></div>
  <div class="error" role="alert" id="error"></div>
</form>
<div style="display:flex;justify-content:space-between;gap:12px;margin-top:14px"><a style="flex:1;padding:9px 8px;border:1px solid #2c4254;border-radius:5px;color:#8aa7bb;font-size:11px;text-align:center;text-decoration:none" href="mailto:support@northstarenergy.ca?subject=NorthStar%20username%20or%20password%20help">Forgot Username/Password</a><a style="flex:1;padding:9px 8px;border:1px solid #2c4254;border-radius:5px;color:#8aa7bb;font-size:11px;text-align:center;text-decoration:none" href="mailto:support@northstarenergy.ca?subject=NorthStar%20support%20request">Contact</a></div>
<p class="foot">Field workers do not sign in here — the check-in page needs no login.</p>
<a class="field-staff-link" href="https://checkin.northstarenergy.ca/contractor-checkin.html">OPEN WORKERS ON-SITE CHECK-IN</a>
</main></div>
<script src="/dashboard-build-data.js?v=build-v0.119"></script><script>
(function(){
  var versionBadge=document.getElementById('loginVersion');
  var build=window.NORTHSTAR_BUILD_DATA&&window.NORTHSTAR_BUILD_DATA.current;
  if(build){
    versionBadge.textContent=build.version;
    var createdAt=build.publishedAt||build.published||'Creation time unavailable';
    versionBadge.dataset.releaseInfo=build.version+' · Created '+createdAt;
    versionBadge.setAttribute('aria-label',build.version+'. Created '+createdAt);
  }
  var systemTime=document.querySelector('#systemTime');
  function updateSystemTime(){
    var now=new Date();
    systemTime.textContent=[now.getHours(),now.getMinutes(),now.getSeconds()].map(function(value){return String(value).padStart(2,'0')}).join(':');
  }
  updateSystemTime();
  setInterval(updateSystemTime,1000);
  var form=document.querySelector('#operatorSignIn'),error=document.querySelector('#error'),notice=document.querySelector('#notice');
  async function clearStaleDashboardPage(){
    try{
      if('caches' in window){
        var names=await caches.keys();
        await Promise.all(names.filter(function(name){return name.indexOf('northstar-control-center-')===0}).map(async function(name){
          var cache=await caches.open(name),requests=await cache.keys();
          await Promise.all(requests.filter(function(request){
            var path=new URL(request.url).pathname;
            return path==='/northstar-clean.html'||path==='/operator-login.html';
          }).map(function(request){return cache.delete(request)}));
        }));
      }
      if('serviceWorker' in navigator){
        var registration=await navigator.serviceWorker.getRegistration('/');
        if(registration&&registration.active&&new URL(registration.active.scriptURL).pathname==='/control-center-sw.js')registration.update().catch(function(){});
      }
    }catch(e){/* Cache recovery must not prevent operator sign-in. */}
  }
  try{
    if(sessionStorage.getItem('northstarSessionEnded')){
      notice.textContent='That session has ended. Sign in again to reopen the dashboard.';
      sessionStorage.removeItem('northstarSessionEnded');
    }
  }catch(e){/* private mode */}
  // Already signed in (a bookmark, a back button): go straight through.
  fetch('/api/auth/session',{cache:'no-store'}).then(function(r){
    if(r.status===404&&/^(localhost|127\.0\.0\.1)$/.test(location.hostname)){
      location.replace('https://ops.northstarenergy.ca/operator-login.html');
      return null;
    }
    return r.json();
  }).then(async function(s){
    if(s&&s.authenticated){await clearStaleDashboardPage();location.replace(s.landingUrl||'/northstar-clean.html')}
  }).catch(function(){});
  form.addEventListener('submit',async function(event){
    event.preventDefault();
    error.textContent='';
    var button=form.querySelector('button');
    button.disabled=true;
    try{
      var response=await fetch('/api/auth/login',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({username:form.username.value,password:form.password.value})
      });
      var body=await response.json().catch(function(){return{}});
      if(response.ok){
        var sessionResponse=await fetch('/api/auth/session',{cache:'no-store'});
        var session=await sessionResponse.json().catch(function(){return{}});
        if(session.authenticated){await clearStaleDashboardPage();location.replace(body.landingUrl||'/northstar-clean.html');return}
        error.textContent='Sign-in was accepted, but this browser did not keep the operator session. Reopen sign-in on ops.northstarenergy.ca and try again.';
      }
      if(response.status===429){
        var wait=Math.ceil((body.retryAfter||60)/60);
        error.textContent='Too many failed attempts. Try again in about '+wait+' minute'+(wait===1?'':'s')+'.';
      }else if(response.status===404){
        error.textContent='Operator sign-in is not available on this hostname.';
      }else if(response.status===503){
        error.textContent='No demo credential is configured on this server.';
      }else{
        error.textContent=body.error||'Sign-in failed.';
      }
    }catch(e){
      error.textContent='The server could not be reached.';
    }
    button.disabled=false;
    form.password.value='';
    form.password.focus();
  });
})();
</script></body></html>
