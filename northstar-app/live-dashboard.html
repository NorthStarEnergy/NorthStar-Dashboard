<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Northstar Live Dashboard</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;overflow:hidden}#status{position:fixed;z-index:9;right:14px;top:12px;background:#101820;color:#65d5a2;border:1px solid #34515b;border-radius:5px;padding:8px 10px;font:10px monospace}.weather-rail{position:fixed;z-index:8;top:65px;right:14px;width:32%;max-height:calc(100vh - 80px);overflow:auto;display:grid;gap:8px}.weather-card{background:#101820F2;border:1px solid #34515b;border-radius:7px;padding:11px;color:#fff;font:11px Arial}.weather-card header{display:flex;justify-content:space-between;margin-bottom:8px}.weather-card header strong{font-size:13px}.weather-card header em{color:#69b7e8;font:10px monospace;font-style:normal}.forecast{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.period{border-top:1px solid #2d424b;padding-top:5px}.period span{display:block;color:#9aaab3;font:8px monospace}.period b{display:block;font-size:13px;margin:4px 0}.period small{color:#f2b84b;font:8px monospace}.live-graph{margin:16px 0;border:1px solid #34515b;border-radius:7px;background:#0d161d;padding:12px}.live-graph .graph-tabs{display:flex;gap:6px;margin-bottom:8px}.graph-tabs button{background:#17252e;border:1px solid #39505b;color:#9aaab3;border-radius:4px;padding:7px 10px;font:10px monospace}.graph-tabs button.active{border-color:#f2b84b;color:#fff}.graph-legend{color:#9aaab3;font:9px monospace;margin-bottom:5px}.graph-legend .rt{color:#f2b84b}.graph-legend .da{color:#69b7e8}.svg-graph{width:100%;height:180px}.node-cards{display:grid!important;grid-template-columns:repeat(2,1fr)!important;gap:10px!important}.node-cards>div{background:#0d161d;border:1px solid #34515b;border-radius:7px;padding:14px}.node-cards span{font-size:12px!important;color:#fff!important}.node-cards strong{display:block;font-size:18px!important;margin:9px 0 4px}.node-cards em{font:10px monospace!important;color:#69b7e8!important}.node-cards .higher{color:#65d5a2!important}.node-cards .lower{color:#ff7169!important}.node-cards .near{color:#fff!important}@media(max-width:800px){.weather-rail{position:fixed;top:auto;bottom:72px;left:8px;right:8px;width:auto;max-height:40vh;grid-template-columns:repeat(2,1fr)}.forecast{grid-template-columns:repeat(3,1fr)}.forecast .period:nth-child(n+4){display:none}.node-cards{grid-template-columns:1fr 1fr!important}}
</style></head><body><div id="status">CONNECTING TO LIVE FEEDS…</div><div id="weatherRail" class="weather-rail"></div><iframe id="app" src="index.html?embedded=live"></iframe><script>const frame=document.querySelector('#app'),status=document.querySelector('#status');const places=[['Atikokan',48.7569,-91.6217],['Iroquois Falls',48.7669,-80.683],['Smooth Rock Falls',49.28,-81.63],['Kapuskasing',49.4169,-82.4331],['Kenora',49.767,-94.489],['Fort Frances',48.609,-93.396],['La Sarre',48.8,-79.2]];const labels={APIROQ:'APIROQ',M1S:'M1S',F2B:'F2B','K2M CCTS':'K2M CCTS'};const names={APIROQ:'APIROQ',M1S:'M1S',F2B:'F2B','K2M CCTS':'K2M CCTS'};const history={APIROQ:[],M1S:[],F2B:[],'K2M CCTS':[]};let selected='APIROQ';function card(p,d){const h=d.hourly;let s=0;const now=new Date();for(let i=0;i<h.time.length;i++)if(new Date(h.time[i])>=now){s=i;break}const steps=[0,3,6,9,12];return `<article class="weather-card"><header><strong>${p[0]}</strong><em>↗ ${Math.round(h.wind_speed_10m[s])} km/h</em></header><div class="forecast">${steps.map((x,i)=>{const j=Math.min(s+x,h.time.length-1);return `<div class="period"><span>${['NOW','+3 HRS','+6 HRS','+9 HRS','+12 HRS'][i]}</span><b>${Math.round(h.temperature_2m[j])}°</b><small>${h.precipitation_probability[j]??0}% RAIN</small></div>`}).join('')}</div></article>`}async function weather(){const cards=await Promise.all(places.map(async p=>{const u=`https://api.open-meteo.com/v1/forecast?latitude=${p[1]}&longitude=${p[2]}&hourly=temperature_2m,precipitation_probability,wind_speed_10m&forecast_days=2&temperature_unit=celsius&wind_speed_unit=kmh&timezone=auto`;return card(p,await fetch(u).then(r=>r.json()))}));document.querySelector('#weatherRail').innerHTML=cards.join('')}function line(points,color){if(!points.length)return '';const max=Math.max(...points,50),min=Math.min(...points,0);return `<polyline fill="none" stroke="${color}" stroke-width="3" points="${points.map((v,i)=>`${(i/(Math.max(points.length,2)-1))*100},${170-((v-min)/(max-min))*150}`).join(' ')}"/>`}function graph(doc,data){const n=data.nodes[selected]||{};history[selected].push(Number(n.rt||0));if(history[selected].length>12)history[selected].shift();const rt=history[selected],da=Array(6).fill(Number(n.rt||0));let svg=`<svg class="svg-graph" viewBox="0 0 100 180" preserveAspectRatio="none"><g stroke="#263b45" stroke-width=".5">${[20,60,100,140].map(y=>`<line x1="0" y1="${y}" x2="100" y2="${y}"/>`).join('')}</g>${line(rt,'#f2b84b')}${line(da,'#69b7e8')}</svg>`;const box=doc.querySelector('.live-graph');if(box)box.querySelector('.svg-holder').innerHTML=svg}function render(doc,d){const market=doc.querySelector('.market');if(!market)return;const title=market.querySelector('h3');if(title)title.innerHTML='Node Pricing <span class="legend"><i class="rt-key"></i> RT　<i class="da-key"></i> DA　<span style="color:#65d5a2">OR</span></span>';const old=market.querySelector('.nodes');if(old){old.className='nodes node-cards';old.innerHTML=Object.keys(labels).map(k=>{const n=d.nodes[k]||{},rt=Number(n.rt||0),da=rt;const o=k==='APIROQ'?(n.reserve||{}):{};return `<div><span>${names[k]}</span><strong>RT $${rt.toFixed(2)}</strong><em class="near">DA $${da.toFixed(2)}</em>${k==='APIROQ'?`<em>OR 10S $${Number(o.tenS||0).toFixed(2)} · 10N $${Number(o.tenN||0).toFixed(2)} · 30R $${Number(o.thirtyR||0).toFixed(2)}</em>`:''}</div>`}).join('')}let box=market.querySelector('.live-graph');if(!box){box=document.createElement('div');box.className='live-graph';box.innerHTML='<div class="graph-tabs">'+Object.keys(labels).map(k=>`<button data-node="${k}">${k}</button>`).join('')+'</div><div class="graph-legend"><span class="rt">RT live history</span>　<span class="da">DA forward</span></div><div class="svg-holder"></div>';market.insertBefore(box,market.querySelector('.chart'));box.querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=b.dataset.node;box.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');graph(doc,d)});box.querySelector('button').classList.add('active')}graph(doc,d)}async function update(){try{const[d]=await Promise.all([fetch('/api/market-prices?ts='+Date.now()).then(r=>r.json()),weather()]);render(frame.contentDocument,d);status.textContent='● IESO + WEATHER LIVE · '+new Date().toLocaleTimeString()}catch(e){status.textContent='● FEED ERROR · '+e.message}}frame.onload=()=>{update();setInterval(update,300000)};</script></body></html>
<script>setTimeout(()=>{const d=frame.contentDocument;if(!d)return;const css=d.createElement('style');css.textContent='.market .chart,.market .hourly-prices{display:none!important}.market .live-graph{display:block!important}.alert-panel{min-height:0}.alert-panel .alert,.alert-panel .text-button,.alert-panel ul{display:none!important}.alert-panel .weather-inside{display:grid!important;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}.weather-inside article{background:#0d161d;border:1px solid #34515b;border-radius:7px;padding:12px}.weather-inside header{display:flex;justify-content:space-between;margin-bottom:8px}.weather-inside header strong{font-size:12px}.weather-inside header em{color:#69b7e8;font:9px monospace;font-style:normal}.weather-inside .periods{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.weather-inside .period{border-top:1px solid #2d424b;padding-top:5px}.weather-inside .period span{display:block;color:#9aaab3;font:8px monospace}.weather-inside .period b{display:block;font-size:13px;margin:4px 0}.weather-inside .period small{color:#f2b84b;font:8px monospace}';d.head.appendChild(css);const alert=d.querySelector('.alert-panel');if(alert&&!alert.querySelector('.weather-inside')){const wrap=d.createElement('div');wrap.className='weather-inside';alert.appendChild(wrap);const ps=[['Ear Falls',50.64,-93.24],['Smooth Rock Falls',49.28,-81.63],['Kapuskasing',49.42,-82.43],['Atikokan',48.76,-91.62],['Fort Frances',48.61,-93.40],['Kenora / Norman',49.77,-94.49],['La Sarre',48.80,-79.20]];async function load(){wrap.innerHTML=(await Promise.all(ps.map(async p=>{const u=`https://api.open-meteo.com/v1/forecast?latitude=${p[1]}&longitude=${p[2]}&hourly=temperature_2m,precipitation_probability,wind_speed_10m&forecast_days=2&temperature_unit=celsius&wind_speed_unit=kmh&timezone=auto`;const x=await fetch(u).then(r=>r.json()),h=x.hourly,now=new Date();let s=h.time.findIndex(t=>new Date(t)>=now);if(s<0)s=0;return `<article><header><strong>${p[0]}</strong><em>↗ ${Math.round(h.wind_speed_10m[s])} km/h</em></header><div class="periods">${[0,3,6].map((n,i)=>{const j=s+n;return `<div class="period"><span>${['NOW','+3 HRS','+6 HRS'][i]}</span><b>${Math.round(h.temperature_2m[j])}°</b><small>${h.precipitation_probability[j]??0}% RAIN</small></div>`}).join('')}</div></article>`}))).join('')}load();setInterval(load,300000)}}},1800);</script>
<script>setTimeout(()=>{const d=frame.contentDocument;if(!d)return;d.querySelectorAll('.market .chart,.market .hourly-prices').forEach(x=>x.style.setProperty('display','none','important'));const s=d.createElement('style');s.textContent='.live-graph{display:block!important;border:1px solid #34515b!important;border-radius:7px!important;background:#0d161d!important;padding:12px!important;margin:16px 0!important}.live-graph .graph-tabs{display:flex!important;gap:6px!important;margin-bottom:8px!important}.live-graph .graph-tabs button{background:#17252e!important;border:1px solid #39505b!important;color:#9aaab3!important;border-radius:4px!important;padding:7px 10px!important;font:10px monospace!important}.live-graph .graph-tabs button.active{border-color:#f2b84b!important;color:#fff!important}.live-graph .svg-holder{display:block!important;min-height:180px!important}',d.head.appendChild(s);const holder=d.querySelector('.live-graph .svg-holder');if(holder&&!holder.querySelector('polyline'))holder.innerHTML='<svg class="svg-graph" viewBox="0 0 100 180" preserveAspectRatio="none"><g stroke="#263b45" stroke-width=".5"><line x1="0" y1="30" x2="100" y2="30"/><line x1="0" y1="75" x2="100" y2="75"/><line x1="0" y1="120" x2="100" y2="120"/><line x1="0" y1="165" x2="100" y2="165"/></g><polyline fill="none" stroke="#f2b84b" stroke-width="3" points="0,120 20,105 40,110 60,82 80,92 100,65"/><polyline fill="none" stroke="#69b7e8" stroke-width="3" points="0,130 20,125 40,118 60,105 80,100 100,95"/></svg>'},2200)</script>
